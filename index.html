<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seagri Ater</title>
  
  <!-- Referência ao Manifesto PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#198754">

  <!-- Configurações Específicas para iOS (Safari) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Seagri Ater">
  <link rel="apple-touch-icon" href="planting192.png">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; font-family: sans-serif; padding-top: 50px; }
    .screen { display: none; padding: 15px; }
    .active { display: block; }
    .card-item { margin-bottom: 10px; border-left: 4px solid #198754; }
    .network-banner {
      position: fixed; top: 0; left: 0; right: 0;
      padding: 6px; text-align: center; font-size: 13px; font-weight: bold; z-index: 9999;
    }
    body.offline-mode {
      overscroll-behavior-y: none;
      touch-action: pan-x pan-y; /* Limita gestos que forçam reload */
    }
    .online { background-color: #d1e7dd; color: #0f5132; }
    .offline { background-color: #f8d7da; color: #842029; }
    /* Animação do Spinner nos botões */
.btn-spinner {
  display: inline-block;
  width: 1rem;
  height: 1rem;
  border: 2px solid rgba(255, 255, 255, 0.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-right: 8px;
  vertical-align: middle;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

/* Estado desabilitado durante o envio */
button:disabled {
  opacity: 0.7;
  cursor: not-allowed;
}

/* Botão Ver no Mapa */
.btn-ver-mapa {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background-color: #0284c7;
  color: #ffffff;
  padding: 6px 12px;
  border-radius: 6px;
  text-decoration: none;
  font-size: 0.875rem;
  font-weight: 500;
  margin-top: 8px;
  transition: background-color 0.2s;
}

.btn-ver-mapa:hover {
  background-color: #0369a1;
}
  </style>
</head>
<body>

  <!-- INDICADOR DE STATUS DA CONEXÃO -->
  <div id="net-status" class="network-banner online">🟢 Conectado - Sincronizado</div>

  <!-- TELA DE LOGIN -->
  <div id="screen-login" class="screen active text-center mt-3">
    <h3>Acesso ao Sistema</h3>
    <small class="text-muted">É necessário estar online para o primeiro login</small>
    <form id="form-login" class="mt-4">
      <input type="email" id="login-email" class="form-control mb-2" placeholder="E-mail" required>
      <input type="password" id="login-senha" class="form-control mb-3" placeholder="Senha" required>
      <button type="submit" class="btn btn-success w-100">Entrar</button>
    </form>
  </div>

  <!-- DASHBOARD PRINCIPAL -->
  <div id="screen-main" class="screen">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 id="user-welcome">Olá!</h5>
      <button onclick="logout()" class="btn btn-outline-danger btn-sm">Sair</button>
    </div>
    
    <div class="d-grid gap-2 mb-4">
      <button onclick="carregarAgricultoresNovaAtividade()" class="btn btn-primary">+ Nova Atividade</button><!-- showScreen('screen-nova-atividade')-->
      <button onclick="carregarAgendamentosTrator()" id="btn-trator" class="btn btn-warning d-none">Agendamentos de Trator</button>
      <button onclick="telaAgricultores()" class="btn btn-info text-white">Agricultores</button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-2">
      <h6>Atividades Pendentes Atribuídas</h6>
      <span id="sync-count" class="badge bg-secondary">Fila Offline: 0</span>
    </div>
    <div id="lista-atividades">Carregando...</div>
  </div>

  <!-- CRIAR ATIVIDADE -->
  <div id="screen-nova-atividade" class="screen">
    <button onclick="showScreen('screen-main')" class="btn btn-secondary btn-sm mb-3">← Voltar</button>
    <h4>Nova Atividade</h4>
    <form id="form-atividade">
      
      <div class="form-floating">
        <input type="date" id="act-data" class="form-control mb-2" required>

      </div>
      <div class="form-floating d-none">
        <input type="text" id="act-solicitante" class="form-control mb-2" placeholder="Solicitante"  required>
        <label for="act-solicitante">Solicitante</label>
      </div>
      <div class="form-floating">
        <input type="text" id="act-agricultor" list="datalist-agricultores" class="form-control mb-2" placeholder="Agricultor" required>
        <label for="act-agricultor">Agricultor</label>
        <datalist id="datalist-agricultores">
          <!-- Preenchido via JavaScript -->
        </datalist>
      </div>
      <div class="form-floating">
        <input type="text" id="act-tipo" class="form-control mb-2" placeholder="Tipo de Atividade" required>
        <label for="act-tipo">Tipo de Atividade</label>
      </div>
      
      <div class="form-floating d-none">
        <input type="text" id="idgps" class="form-control mb-2" placeholder="Tipo de Atividade">
        
      </div>
      <div class="form-floating mb-3">
        <select class="form-select form-select-lg" id="act-responsavel" aria-label="Selecione um Responsável" required>
          <!--option value="">Carregando responsáveis...</option-->

      <div class="form-floating">
        <input type="text" id="act-localidade" class="form-control mb-2" placeholder="Localidade" required>

      </div>
      <div class="form-floating">
        <textarea id="act-objetivo" class="form-control mb-3" placeholder="Objetivo"></textarea>
        <label for="act-objetivo">Objetivo</label>
      </div>

      <button type="submit" class="btn btn-success w-100">Salvar</button>

  </div>

  <!-- EXECUÇÃO DE ATIVIDADE -->
  <div id="screen-execucao" class="screen">
    <button onclick="showScreen('screen-main')" class="btn btn-secondary btn-sm mb-3">← Voltar</button>
    <h4>Concluir Atividade</h4>
    <form id="form-execucao">
      <div class="form-floating">
        <input type="hidden" id="exec-id">
        <input type="date" id="exec-data" class="form-control mb-2" required>
        <label for="exec-data">Data</label>
      </div>
      <div class="form-floating">
        <input type="text" id="exec-tecnicos" class="form-control mb-2" placeholder="Técnicos Presentes" required>
        <label for="exec-tecnicos">Técnicos Presentes</label>
      </div>
      <div class="form-floating">
        <textarea id="exec-atividade" class="form-control mb-2" placeholder="Atividade Realizada" required></textarea>
        <label for="exec-atividade">Atividade Realizada</label>
      </div>
      
      <div class="input-group mb-3">
        <input type="text" id="exec-geo" class="form-control" placeholder="Geolocalização (Lat, Long)" required>
        <button type="button" onclick="obterGeolocalizacao()" class="btn btn-outline-secondary">GPS</button>
      </div>
       <div class="form-floating" id="maps">
        
      </div>
       
      <button type="submit" class="btn btn-success w-100">Registrar Execução</button>
    </form>
  </div>

  <!-- TELA LISTA TRATOR (MÊS) -->
  <div id="screen-lista-trator" class="screen">
    <button onclick="showScreen('screen-main')" class="btn btn-secondary btn-sm mb-3">← Voltar</button>
    <h4>Agendamentos de Trator</h4>
    
    <div class="row g-2 mb-3 align-items-center">
      <div class="col-8">
        <input type="month" id="filtro-mes-trator" class="form-control" onchange="carregarAgendamentosTrator()">
      </div>
      <div class="col-4">
        <button onclick="novoAgendamentoTrator()" class="btn btn-warning w-100 btn-sm">+ Novo</button>
      </div>
    </div>

    <div id="lista-agendamentos-trator">Carregando...</div>
  </div>

  <!-- AGENDAMENTO TRATOR (FORMULÁRIO) -->
  <div id="screen-trator" class="screen">
    <button onclick="showScreen('screen-lista-trator')" class="btn btn-secondary btn-sm mb-3">← Voltar</button>
    <h4 id="trator-form-title">Agendar / Editar Trator</h4>
    <form id="form-trator">
      <input type="hidden" id="trator-id">
        
      <div class="form-floating">
        <input type="text" id="trator-agricultor" class="form-control mb-2" placeholder="Agricultor" required>
        <label for="trator-agricultor">Agricultor</label>
      </div>
      <div class="form-floating">
        <input type="date" id="trator-data" class="form-control mb-2" required>
        <label for="trator-data">Data</label>
      </div>
      <div class="form-floating">
        <input type="text" id="trator-local" class="form-control mb-2" placeholder="Local / Propriedade" required>
        <label for="trator-local">Local / Propriedade</label>
      </div>
      <div class="form-floating">
        <input type="number" id="trator-horas" class="form-control mb-2" placeholder="Horas Previstas" required>
        <label for="trator-horas">Horas Previstas</label>
      </div>
      <div class="form-floating">
        <textarea id="trator-servico" class="form-control mb-3" placeholder="Serviço a Realizar" required></textarea>
        <label for="trator-servico">Serviço a Realizar</label>
      </div>
    
      <button type="submit" class="btn btn-success w-100">Salvar Agendamento</button>
    </form>
  </div>

  <!-- AGRICULTORES -->
  <div id="screen-agricultores" class="screen">
    <button onclick="showScreen('screen-main')" class="btn btn-secondary btn-sm mb-3">← Voltar</button>
    <h4>Agricultores</h4>
    <div class="d-flex gap-2 mb-3">
        <input type="text" id="busca-agricultor" class="form-control" placeholder="Pesquisar por nome ou apelido" oninput="filtrarAgricultores()">
    <button onclick="novoAgricultor()" class="btn btn-primary text-nowrap">+ Novo</button>
  </div>
    <!--button onclick="novoAgricultor()" class="btn btn-sm btn-outline-primary mb-3">+ Novo Agricultor</button-->
    <div id="lista-agricultores"></div>
  </div>

  <!-- FORMULARIO AGRICULTOR -->
  <div id="screen-form-agricultor" class="screen">
    <button onclick="showScreen('screen-agricultores')" class="btn btn-secondary btn-sm mb-3">← Voltar</button>
    <h4 id="agri-form-title">Cadastrar Agricultor</h4>
    <form id="form-agricultor">
      <input type="hidden" id="agri-id">
        
      <div class="form-floating">
        <input type="text" id="agri-nome" class="form-control mb-2" placeholder="Nome Completo" required>
        <label for="agri-nome">Nome Completo</label>
      </div>
      <div class="form-floating">
        <input type="text" id="agri-apelido" class="form-control mb-2" placeholder="Apelido">
        <label for="agri-apelido">Apelido</label>
      </div>
      <div class="form-floating">
        <input type="text" id="agri-caf" class="form-control mb-2" placeholder="Número do CAF">
        <label for="agri-caf">Número do CAF</label>
      </div>
      <div class="form-floating">
        <input type="date" id="agri-datacaf" class="form-control mb-2" placeholder="Data Cadastro CAF">
        <label for="agri-datacaf">Data Cadastro CAF</label>
      </div>
      <div class="form-floating">
        <input type="text" id="agri-localidade" class="form-control mb-2" placeholder="Localidade">
        <label for="agri-localidade">Localidade</label>
      </div>
      <div class="form-floating">
        <input type="text" id="agri-contacto" class="form-control mb-2" placeholder="Contacto">
        <label for="agri-contacto">Contacto</label>
      </div>
      <div class="form-floating">
        <input type="text" id="agri-cultivo" class="form-control mb-2" placeholder="Tipo de Cultivo">
        <label for="agri-cultivo">Tipo de Cultivo</label>
      </div>
      <div class="form-floating">
        <input type="number" step="0.01" id="agri-terra" class="form-control mb-2" placeholder="Tamanho da Terra (ha)">
        <label for="agri-terra">Tamanho da Terra (ha)</label>
      </div>
      <div class="input-group mb-3">
        <input type="text" id="agri-geo" class="form-control" placeholder="Geolocalização (Lat, Long)" required>
        <button type="button" onclick="obterGeolocalizacaoAgri()" class="btn btn-outline-secondary">GPS</button>
      </div>
      <div class="form-floating">
        <textarea id="agri-obs" class="form-control mb-3" placeholder="Observações"></textarea>
        <label for="agri-obs">Observações</label>
      </div>
      <button type="submit" class="btn btn-success w-100">Salvar Dados</button>
    </form>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzCnUtzeoXtVmA8SfOdffNqSCDm_PGp74-O8RA7RS4F2-Ix7AnnHN3kF5m3SBG7wc_-gw/exec";
    let currentUser = JSON.parse(localStorage.getItem("user")) || null;
    let db;
    let listaTratorCache = [];

    // --- BANCO DE DADOS LOCAL (IndexedDB) ---
    function initDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open("AppAgricolaDB", 3); // Versão incrementada para suportar a tabela de trator
        req.onupgradeneeded = (e) => {
          const dbInstance = e.target.result;
          if (!dbInstance.objectStoreNames.contains("syncQueue")) {
            dbInstance.createObjectStore("syncQueue", { keyPath: "autoId", autoIncrement: true });
          }
          if (!dbInstance.objectStoreNames.contains("atividades")) {
            dbInstance.createObjectStore("atividades", { keyPath: "id" });
          }
          if (!dbInstance.objectStoreNames.contains("agricultores")) {
            dbInstance.createObjectStore("agricultores", { keyPath: "id" });
          }
          if (!dbInstance.objectStoreNames.contains("trator")) {
            dbInstance.createObjectStore("trator", { keyPath: "id" });
          }
          
          if (!dbInstance.objectStoreNames.contains("usuarios")) {
            dbInstance.createObjectStore("usuarios", { keyPath: "id" });
          }
        };
        req.onsuccess = (e) => { db = e.target.result; resolve(db); };
        req.onerror = (e) => reject(e);
      });
    }

    async function dbOperation(storeName, mode, callback) {
      const tx = db.transaction(storeName, mode);
      const store = tx.objectStore(storeName);
      return new Promise((resolve) => {
        const req = callback(store);
        tx.oncomplete = () => resolve(req ? req.result : true);
      });
    }

    // --- EVENTOS E MONITOR DE REDE ---
    window.addEventListener("online", updateNetworkStatus);
    window.addEventListener("offline", updateNetworkStatus);

    async function updateNetworkStatus() {
      const banner = document.getElementById("net-status");
      if (navigator.onLine) {
        banner.className = "network-banner online";
        banner.innerText = "🟢 Conectado - Sincronizando...";
        await processSyncQueue();
        document.body.classList.add('offline-mode');
        banner.innerText = "🟢 Conectado - Sincronizado";
      } else {
        banner.className = "network-banner offline";
        banner.innerText = "🔴 Sem Internet - Modo Offline Ativo";
        document.body.classList.remove('offline-mode');
      }
      updateSyncBadge();
    }

    async function updateSyncBadge() {
      if (!db) return;
      const queue = await dbOperation("syncQueue", "readonly", store => store.getAll());
      document.getElementById("sync-count").innerText = `Fila Offline: ${queue.length}`;
    }

    // --- SERVICE WORKER PARA CACHE E PWA ---
    if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js')
    .catch(err => console.log('Erro ao registrar SW:', err));
}
   

    // --- INICIALIZAÇÃO DA APLICAÇÃO ---
    document.addEventListener("DOMContentLoaded", async () => {
      await initDB();
      
      // Define valor inicial do filtro do mês para o mês atual (YYYY-MM)
      const hoje = new Date();
      const mesAtual = hoje.toISOString().slice(0, 7);
      document.getElementById("filtro-mes-trator").value = mesAtual;

      updateNetworkStatus();
      if (currentUser) {
        iniciarSessao();
        
      }
    });

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
      if(screenId == "screen-nova-atividade"){
        document.getElementById("act-data").value = new Date().toISOString().slice(0, 10);
      }
      if(screenId == "screen-execucao"){
        document.getElementById("exec-data").value = new Date().toISOString().slice(0, 10);
      }
    }

    // --- CAMADA DE COMUNICAÇÃO E MODO OFFLINE ---
    async function apiRequest(payload) {
      if (navigator.onLine) {
        try {
          const resp = await fetch(API_URL, {
            method: "POST",
            body: JSON.stringify(payload)
          });
          return await resp.json();
        } catch (e) {
          return queueOffline(payload);
        }
      } else {
        return queueOffline(payload);
      }
    }

    async function queueOffline(payload) {
      if (payload.action === "login") {
        return { success: false, message: "Primeiro login requer conexão com a internet." };
      }
      if (payload.action === "getMinhasAtividades") {
        const local = await dbOperation("atividades", "readonly", store => store.getAll());
        return { success: true, data: local.filter(a => a.responsavel === payload.usuario && a.status !== "Concluída") };
      }
      if (payload.action === "getAgricultores") {
        const local = await dbOperation("agricultores", "readonly", store => store.getAll());
        return { success: true, data: local };
      }
      if (payload.action === "getAgendamentosTrator") {
        const local = await dbOperation("trator", "readonly", store => store.getAll());
        return { success: true, data: local };
      }
      if (payload.action === "getUsuarios") {
        const local = await dbOperation("usuarios", "readonly", store => store.getAll());
        return { success: true, data: local };
      }

      // Operações de escrita: adiciona na fila offline
      await dbOperation("syncQueue", "readwrite", store => store.add({ payload: payload, timestamp: Date.now() }));
      
      if (payload.action === "executarAtividade") {
        const act = await dbOperation("atividades", "readonly", store => store.get(payload.id));
        if (act) {
          act.status = "Concluída";
          await dbOperation("atividades", "readwrite", store => store.put(act));
        }
      }
      if (payload.action === "salvarAgricultor") {
        const tempObj = { ...payload, id: payload.id || "temp_" + Date.now() };
        await dbOperation("agricultores", "readwrite", store => store.put(tempObj));
      }
      if (payload.action === "agendarTrator") {
        const tempObj = { ...payload, id: payload.id || "temp_" + Date.now() };
        await dbOperation("trator", "readwrite", store => store.put(tempObj));
      }

      updateSyncBadge();
      return { success: true, offlineQueued: true };
    }

    async function processSyncQueue() {
      const queue = await dbOperation("syncQueue", "readonly", store => store.getAll());
      if (!queue || queue.length === 0) return;

      for (let item of queue) {
        try {
          const resp = await fetch(API_URL, { 
            method: "POST", 
            body: JSON.stringify(item.payload) 
          });
          const res = await resp.json();

          if (res.success) {
            const idParaDeletar = item.id !== undefined ? item.id : item.autoId;
            await dbOperation("syncQueue", "readwrite", store => store.delete(idParaDeletar));
          }
        } catch (e) {
          console.error("Erro ao sincronizar item offline:", e);
          break;
        }
      }

      await updateSyncBadge();

      if (currentUser) {
        if (typeof carregarAtividadesAtribuidas === "function") {
          await carregarAtividadesAtribuidas();
        }
        if (typeof carregarAgricultores === "function") {
          await carregarAgricultores();
        }
        if (typeof carregarAgendamentosTrator === "function") {
          await carregarAgendamentosTrator();
        }
      }
    }

    // --- AUTENTICAÇÃO ---
    document.getElementById("form-login").onsubmit = async (e) => {
      e.preventDefault();
      const res = await apiRequest({
        action: "login",
        email: document.getElementById("login-email").value,
        senha: document.getElementById("login-senha").value
      });
      if (res.success) {
        currentUser = res.user;
        localStorage.setItem("user", JSON.stringify(currentUser));
        iniciarSessao();
      } else {
        alert(res.message);
      }
    };

    function iniciarSessao() {
      document.getElementById("user-welcome").innerText = `Olá, ${currentUser.nome}`;
      
      document.getElementById("act-solicitante").innerText = `${currentUser.nome}`;
      
      let perfilUsuario = currentUser.perfil ? currentUser.perfil.trim().toLowerCase() : "";
      console.log("Perfil logado:", perfilUsuario);

      let btnTrator = document.getElementById("btn-trator");
      
      if (btnTrator) {
        if (perfilUsuario === "trator") {
          btnTrator.classList.remove('d-none'); // Mostra se for Trator
        } else {
          btnTrator.classList.add('d-none');    // Garante que some para qualquer outro perfil
        }
      }
      showScreen("screen-main");
      carregarAtividadesAtribuidas();
      carregarAgricultores();
      carregarUsuarios();
     // carregarAgricultoresNovaAtividade();
    }

    function logout() {
      localStorage.removeItem("user");
      currentUser = null;
      showScreen("screen-login");
    }

    // --- ATIVIDADES ---
    async function carregarAtividadesAtribuidas() {
      const container = document.getElementById("lista-atividades");
      container.innerHTML = "Buscando...";
      const res = await apiRequest({ action: "getMinhasAtividades", usuario: currentUser.nome });
      if (res.success) {
        if (navigator.onLine && !res.offlineQueued) {
          for (let item of res.data) {
            await dbOperation("atividades", "readwrite", store => store.put(item));
          }
        }
        
        if (res.data.length === 0) {
          container.innerHTML = "<p class='text-muted'>Nenhuma atividade pendente.</p>";
          return;
        }
        container.innerHTML = res.data.map(item => `
          <div class="card card-item p-3" onclick="abrirExecucao('${item.id}'); verificarExibirBotaoMapa('${item.geolocalizacao}');">
            <strong>${item.tipo} - ${item.agricultor}</strong>
            <small>${item.localidade} | ${item.data}</small>
            <p class="mb-0 text-truncate">${item.objetivo}</p>
          </div>
        `).join('');
      }
    }

    function abrirExecucao(id) {
      document.getElementById("exec-id").value = id;
      showScreen("screen-execucao");
    }

    function obterGeolocalizacao() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
          document.getElementById("exec-geo").value = `${pos.coords.latitude}, ${pos.coords.longitude}`;
        }, () => {

    async function carregarAgendamentosTrator() {
      showScreen("screen-lista-trator");
      const div = document.getElementById("lista-agendamentos-trator");
      div.innerHTML = "Carregando...";

      const mesFiltro = document.getElementById("filtro-mes-trator").value; // Formato YYYY-MM
      const res = await apiRequest({ action: "getAgendamentosTrator" });

      if (res.success) {
        listaTratorCache = res.data || [];

        if (navigator.onLine && !res.offlineQueued) {
          for (let item of res.data) {
            await dbOperation("trator", "readwrite", store => store.put(item));
          }
        }

        // Filtra pelo mês selecionado na interface
        const agendamentosFiltrados = listaTratorCache.filter(item => {
          if (!item.data) return false;
          return item.data.substring(0, 7) === mesFiltro;
        });

        if (agendamentosFiltrados.length === 0) {
          div.innerHTML = "<p class='text-muted'>Nenhum agendamento encontrado para este mês.</p>";
          return;
        }
        console.log(agendamentosFiltrados.length);
        div.innerHTML = agendamentosFiltrados.map(item => {
         
          const dataFormatada = item.data ? item.data.split('-').reverse().join('/') : '';
          return `
          <div class="card card-item p-3 mb-2">
            <div class="d-flex justify-content-between align-items-start">
              <div>
                <strong>${item.agricultor}</strong>
                <div><small>🗓️ ${dataFormatada} | 📍 ${item.local}</small></div>
                <div><small>⏱️ ${item.horas} hora(s)</small></div>
                <small class="text-secondary">${item.servico}</small>
              </div>
              <button class="btn btn-sm btn-outline-warning" onclick="editarAgendamentoTrator('${item.id}')">Editar</button>
            </div>
          </div>
        `;
      }).join('');
      } else {
        div.innerHTML = "<p class='text-danger'>Erro ao carregar agendamentos.</p>";
      }
    }

    // Função auxiliar para gerenciar estado de salvando
function setButtonLoading(button, isLoading, originalText = 'Salvar') {
  if (isLoading) {
    button.disabled = true;
    button.dataset.originalText = button.innerHTML;
    button.innerHTML = `<span class="btn-spinner"></span> Salvando...`;
  } else {
    button.disabled = false;
    button.innerHTML = button.dataset.originalText || originalText;
  }
}

formIDs.forEach(formId => {
  const form = document.getElementById(formId);
  if (!form) return;

  form.addEventListener('submit', async function (event) {
    // Previne comportamento padrão caso não seja manipulado por AJAX/IndexedDB
    const submitBtn = form.querySelector('button[type="submit"]') || form.querySelector('.btn-submit');
    
    if (submitBtn) {
      setButtonLoading(submitBtn, true);
      
      // Caso seu envio seja assíncrono (ex: salvar no IndexedDB ou API)
      try {
        // Exemplo: await salvarDados();
        // setTimeout simula a conclusão do salvamento
        setTimeout(() => {
          setButtonLoading(submitBtn, false);
        }, 1500);
      } catch (error) {
        setButtonLoading(submitBtn, false);
      }
    }
  });
});
